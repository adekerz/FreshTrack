version: '3.9'

# ─────────────────────────────────────────────────────────────
# FreshTrack — Local Development
#
# Usage:
#   docker compose up -d          # Start postgres + server
#   docker compose logs -f server # Watch server logs
#   docker compose down           # Stop all
#   docker compose down -v        # Stop + delete postgres data
#
# Frontend still runs on host:
#   npm run dev:client            # localhost:5173
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshtrack
      POSTGRES_PASSWORD: freshtrack
      POSTGRES_DB: freshtrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend Server ─────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://freshtrack:freshtrack@db:5432/freshtrack
      # Override remaining vars via server/.env or add here:
      # JWT_SECRET: change-me-in-dev
      # CORS_ORIGINS: http://localhost:5173
    env_file:
      - ./server/.env          # Local overrides (gitignored)
    volumes:
      # Persist uploaded files (logos, etc.) across restarts
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
