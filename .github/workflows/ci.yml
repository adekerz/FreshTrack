name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем предыдущие запуски того же PR/ветки — экономит минуты
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # 2. Client unit tests (vitest + happy-dom)
  # ─────────────────────────────────────────────
  test-client:
    name: Client Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm run test:run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Server unit tests (vitest + node env)
  # ─────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: lint

    # PostgreSQL service — локальная тестовая БД
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: freshtrack_test
          POSTGRES_USER: freshtrack
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://freshtrack:testpassword@localhost:5432/freshtrack_test
      JWT_SECRET: test-jwt-secret-for-ci-only-not-production
      NODE_ENV: test
      DISABLE_MFA_IN_DEV: 'true'
      DISABLE_TERMS_CHECK_IN_DEV: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server tests
        run: npm run test:server

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/server/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. Build check (клиент Vite)
  # ─────────────────────────────────────────────
  build:
    name: Build Client
    runs-on: ubuntu-latest
    needs: [test-client, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client
        env:
          NODE_ENV: production
          # Vite public env vars — добавь свои VITE_* переменные если нужно
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.example.com/api' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist/
          retention-days: 3

  # ─────────────────────────────────────────────
  # 5. Lighthouse CI budget check (optional)
  # Проверяет что Production build укладывается в бюджет
  # ─────────────────────────────────────────────
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    # Запускаем только на push в main, не на PR — экономит время
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist/

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli

      - name: Start preview server
        run: npm run preview &
        env:
          PORT: 4173

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:4173 \
            --collect.numberOfRuns=1 \
            --assert.budgetFile=./lighthouse-budget.json \
            --upload.target=temporary-public-storage
        continue-on-error: true  # Не блокируем деплой на бюджетных предупреждениях

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # Railway деплоит автоматически после того как все jobs завершились успешно.
  # Настройка: Railway → Service Settings → Source → "Wait for CI" = ON
  # Никакого отдельного deploy job не нужно.
